name: Application package contract
on:
  push:
    branches: [main, "feat/**"]
    paths: ["schemas/**", "tests/**", "*.json", ".github/workflows/package-contract.yml"]
  pull_request:
    paths: ["schemas/**", "tests/**", "*.json", ".github/workflows/package-contract.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - run: python -m unittest discover -s tests -p 'test_package_manifest.py'
      - run: python tests/validate_package.py
